name: Deploy Extensions

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. 0.3.1)"
        required: false
        type: string
      dry_run:
        description: "Dry run (test build only - do not upload to stores or create GitHub release)"
        required: false
        default: false
        type: boolean
      publish_cws:
        description: "Publish to Chrome Web Store (ignored if dry run)"
        required: false
        default: false
        type: boolean
      publish_amo:
        description: "Publish to Mozilla Add-ons (Firefox) (ignored if dry run)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
      IS_DRY_RUN: ${{ github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests & validation
        run: |
          npm test
          npm run typecheck
          npm run build
          npm run validate
          npm run package

      - name: Attest build provenance for release archives
        if: ${{ env.IS_DRY_RUN != 'true' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/canvas-to-obsidian-sync-chrome-*.zip
            release/canvas-to-obsidian-sync-firefox-*.zip

      - name: Publish GitHub release with zip archives
        if: ${{ env.IS_DRY_RUN != 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release/canvas-to-obsidian-sync-chrome-*.zip
            release/canvas-to-obsidian-sync-firefox-*.zip
            release/checksums.txt

      - name: Publish to Chrome Web Store
        continue-on-error: true
        if: ${{ env.IS_DRY_RUN != 'true' && (github.event_name == 'push' || github.event.inputs.publish_cws == true || github.event.inputs.publish_cws == 'true') }}
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_PUBLISH: "true"
        run: npm run publish:cws

      - name: Publish to Mozilla Add-ons (AMO)
        continue-on-error: true
        if: ${{ env.IS_DRY_RUN != 'true' && (github.event_name == 'push' || github.event.inputs.publish_amo == true || github.event.inputs.publish_amo == 'true') }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: npm run publish:amo
