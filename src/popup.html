<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Sync</title>
    <style>
      :root {
        --bg: #f6f7f3;
        --card: #ffffff;
        --ink: #1f2d24;
        --accent: #0f7b5f;
        --accent-hover: #0c644d;
        --accent-2: #3a4d40;
        --muted: #637067;
        --border: #ced4cd;
        --light-bg: #edf2ed;
      }
      body {
        margin: 0;
        width: 340px;
        min-height: 380px;
        font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at top right, #d8efe7, var(--bg) 58%);
        color: var(--ink);
        padding: 12px;
        box-sizing: border-box;
      }
      .panel {
        background: var(--card);
        border-radius: 12px;
        padding: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 17px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      p.subtitle {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }
      .section-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        margin: 12px 0 6px 0;
        border-bottom: 1px solid #edf0ed;
        padding-bottom: 4px;
      }
      .course-preview {
        background: var(--light-bg);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 10px;
      }
      .course-preview .title {
        font-size: 13px;
        font-weight: 600;
        word-break: break-word;
      }
      .course-preview .code {
        font-size: 11px;
        color: var(--accent);
        font-weight: 700;
      }
      .options-grid {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 8px 0;
      }
      .option-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }
      .option-item input[type="checkbox"] {
        margin: 0;
        cursor: pointer;
        accent-color: var(--accent);
      }
      .option-subitem {
        margin-left: 22px;
        font-size: 11px;
        color: var(--muted);
      }
      .port-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
        gap: 8px;
      }
      .port-row label {
        font-size: 12px;
        font-weight: 600;
      }
      .port-row input {
        width: 80px;
        box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 12px;
        text-align: center;
      }
      button {
        margin-top: 10px;
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 9px 12px;
        background: linear-gradient(120deg, var(--accent), #139874);
        color: #ffffff;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.05);
      }
      button.secondary {
        background: #eef2ee;
        color: var(--ink);
        font-weight: 600;
        border: 1px solid #d8ded8;
        padding: 7px 10px;
        font-size: 12px;
        margin-top: 6px;
      }
      .token-row {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .token-row label {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
      }
      .token-input-wrapper {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .token-input-wrapper input {
        flex: 1;
        box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 12px;
      }
      .toggle-token-btn {
        width: 32px !important;
        margin: 0 !important;
        padding: 5px 0 !important;
        background: var(--light-bg) !important;
        color: var(--ink) !important;
        border: 1px solid var(--border) !important;
        border-radius: 6px !important;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .availability-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        margin-top: 4px;
        margin-bottom: 6px;
      }
      .availability-chip {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--light-bg);
        border-radius: 6px;
        padding: 4px 6px;
        font-size: 11px;
        gap: 4px;
      }
      .availability-chip .chip-label {
        font-weight: 500;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 10.5px;
      }
      .availability-chip .chip-badge {
        font-weight: 600;
        font-size: 9.5px;
        padding: 1px 4px;
        border-radius: 4px;
        white-space: nowrap;
      }
      .status-available {
        color: #0c644d;
        background: #d8efe7;
      }
      .status-restricted {
        color: #9a6700;
        background: #fff8e1;
      }
      .status-empty {
        color: #637067;
        background: #e4e8e4;
      }
      .status-unsupported {
        color: #7b8089;
        background: #e9ecef;
      }
      .status-error {
        color: #a0291e;
        background: #fde8e8;
      }
      #status {
        margin-top: 10px;
        font-size: 11px;
        min-height: 16px;
        line-height: 1.4;
      }
      .ok {
        color: #13684d;
        font-weight: 600;
      }
      .error {
        color: #a0291e;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>🎓 Canvas to Obsidian</h1>
      <p class="subtitle">Extract coursework via your active browser session directly to your local Obsidian vault.</p>

      <div class="course-preview" id="coursePreview">
        <div class="code" id="courseCodeDisplay">Detecting course...</div>
        <div class="title" id="courseNameDisplay">Open a Canvas course tab</div>
      </div>

      <div class="section-title">Course Data Availability</div>
      <button id="scanBtn" class="secondary" style="margin-top: 4px; margin-bottom: 6px;">Scan Availability</button>
      <div id="availabilityContainer" class="availability-grid"></div>

      <div class="section-title">Extraction Options</div>
      <div class="options-grid">
        <label class="option-item">
          <input type="checkbox" id="optModules" checked />
          <span>Modules & Wiki Pages</span>
        </label>
        <label class="option-item">
          <input type="checkbox" id="optAssignments" checked />
          <span>Assignments & Rubrics</span>
        </label>
        <label class="option-item">
          <input type="checkbox" id="optGrades" checked />
          <span>Grades & Submissions</span>
        </label>
        <label class="option-item">
          <input type="checkbox" id="optAnnouncements" checked />
          <span>Announcements & Updates</span>
        </label>
        <label class="option-item">
          <input type="checkbox" id="optDiscussions" checked />
          <span>Discussion Topics</span>
        </label>
        <label class="option-item option-subitem">
          <input type="checkbox" id="optDiscussionReplies" checked />
          <span>Include Discussion Reply Trees</span>
        </label>
        <label class="option-item">
          <input type="checkbox" id="optEvents" checked />
          <span>Calendar & Course Events</span>
        </label>
        <label class="option-item">
          <input type="checkbox" id="optFiles" checked />
          <span>Course Files & Document Assets</span>
        </label>
      </div>

      <div class="section-title">Bridge Connection</div>
      <div class="port-row">
        <label for="port">Obsidian Port:</label>
        <input id="port" type="number" min="1" max="65535" value="27125" />
      </div>
      <div class="token-row">
        <label for="pairingToken">Bridge Pairing Token (Optional):</label>
        <div class="token-input-wrapper">
          <input id="pairingToken" type="password" placeholder="Optional token" autocomplete="off" />
          <button type="button" id="toggleTokenBtn" class="toggle-token-btn" title="Toggle visibility">👁️</button>
        </div>
      </div>

      <button id="syncBtn">Sync Active Course</button>
      <button id="testBtn" class="secondary">Test Bridge Connection</button>
      <div id="status"></div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
